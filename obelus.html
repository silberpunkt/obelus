<!-- This toronation was spun in honor and form of Obelix, a Free Gaul of Armorica.

     obelus.html. eniamb for User1, 12 xi 2026. One file; nothing is fetched. Grown from kinescope.html, which is kept as it was.
     User1: "This is Obelus, the traditional one... with a dot on top (our mot juste) and a middle line, that's our typeline,
     and a corresponding dot at bottom... the Pendule shall properly depend from the Prependule above... Above, if proportioned
     or rationed by the below." And of colour: "I do not need a recording, I have words." So the tint of a word is taken from
     its own sound, read from its letters by Ecouter's Lexillogue (the NRL rules of 1976), which rides in this page.
     The sign itself: U+00F7 DIVISION SIGN is the one on the keys; U+2E13 DOTTED OBELOS is the editors' mark it came from;
     and U+2E0E EDITORIAL CORONIS, the flourish that closes a work, is (User1) "precisely what we have done". -->

html { --bg: #000; --fg: #ddd; --dim: #888; --line: #555; --hi: #fff; --track: #575757; --knob: #a0a0a0; --go: #a6e8a0; }   /* the trackway: 34 in the hundred */
/* THE MIDDLE GROUND (User1, 14 xi 2026, from his light table: "BEGIN with middle light gray... So I saw white and black, as
   extents"). On black or on white there is one way to go, away from the ground. On middle grey there are two, and the
   form has two: above the line the words go toward white, the mot juste lightest; below it they go toward black, the
   Pendule darkest; on the line what is to come is light and what has been said is dark. The page itself tilts the
   other way to answer them, a little darker at the top and lighter at the foot. The fleuriant adds light to the
   ground and the Inrose takes it away. */
html.mid { --bg: #7c7c7c; --fg: #111; --dim: #3a3a3a; --line: #5e5e5e; --hi: #000; --track: #5c5c5c; --knob: #d4d4d4; --go: #0e4f1a; }   /* the knob as bright as a lit button (User1: "slider thumbs must be at least as bright as the buttons. Else, they are dulled. Shine them up!"); it was #a2a2a2, under even the plain ones */
html.mid body { background: linear-gradient(to bottom, #707070 0%, #808080 50%, #909090 100%); }
html.mid #bar, html.mid #surfoot { background: transparent; }
html.mid #top { background: transparent; mix-blend-mode: screen; } html.mid #brand { color: #fff; } html.mid #juste { color: #d8d8d8; } html.mid #juste b { color: #fff; }
/* on Mittel every button has a light grey face, lighter under the pointer (User1: "since we are kind of in Blender here") */
html.mid button, html.mid select { background: #b0b0b0; color: #111; border-color: #5e5e5e; }
html.mid button:hover, html.mid select:hover { background: #cacaca; border-color: #000; }
html.mid button.on { background: #d4d4d4; border-color: #000; color: #000; }
html.mid #menu button { background: #b0b0b0; color: #111; } html.mid #menu button:hover, html.mid #menu button.on { background: #d4d4d4; color: #000; }
html.mid #toggles button:not(.on), html.mid #viewbar button:not(.on), html.mid #numbar button:not(.on), html.mid #fontbar button:not(.on) { color: #555; }
html.mid #voice, html.mid #speech, html.mid #lilt { color: var(--go); }
html.mid #flareB { mix-blend-mode: multiply; opacity: 0.5; }
html.paper { --bg: #fff; --fg: #222; --dim: #777; --line: #aaa; --hi: #000; --track: #a8a8a8; --knob: #5f5f5f; --go: #1c7a2c; }

html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--face, "Microsoft Sans Serif", Helvetica, Arial, sans-serif); overflow: hidden; }
#cake, #past, #words { position: absolute; z-index: 1; left: 0; top: 64px; width: 100%; height: calc(100% - 162px); display: block; touch-action: none; }
#past { opacity: 0.3; pointer-events: none; }
#words { pointer-events: none; }
#top { position: absolute; z-index: 0; left: 0; top: 0; width: 100%; height: 64px; background: #000; }
#roll { position: absolute; left: 0; top: 0; width: 100%; height: 64px; display: block; cursor: pointer; } body.nogui #roll { opacity: 0; }   /* with the bars away the strip is still drawn here, straight, and takes the clicks; what is SEEN then is its flared copy */
#flareT { position: absolute; left: 0; top: 0; width: 100%; display: block; pointer-events: none; }
#fl { position: absolute; left: calc(50% - 32px); top: 0; width: 64px; height: 64px; display: block; cursor: pointer; }
/* clicked, the strip and its fleuriant double. They lie UNDER the cones and everything else, and move nothing. */
#top.big { height: 128px; } #top.big #roll { height: 128px; } #top.big #fl { left: calc(50% - 64px); width: 128px; height: 128px; }
html.paper #top { background: #fff; } html.paper #roll, html.paper #fl { filter: invert(1) hue-rotate(180deg); }   /* (in the flared copy the strip's turning to ink on Day is done pixel by pixel, since every pixel is handled there anyway: a filter laid over so wide a sheet was costly) */
/* the Scintillar: two small sheets under the now-point, above the picture and under the line's own type, one shown each frame */
.scint { position: absolute; z-index: 1; pointer-events: none; display: none; image-rendering: pixelated; }
#tape { position: absolute; z-index: 2; left: 0; top: calc(64px + (100% - 162px) / 2 - 68px); width: 100%; height: 136px; display: block; cursor: grab; touch-action: none; }
/* THE INROSE lies at the foot of the page, under the two feet, which hold its place while they are shown (User1: the bars
   "do well to hold the place of a practical emptiness"). Hide the GUI and it is there. */
#ground { position: absolute; z-index: 0; left: 0; bottom: 0; width: 100%; height: 64px; display: block; opacity: 0; }   /* drawn straight and unseen, as the strip above; its flared copy is what shows */
#flareB { position: absolute; z-index: 0; left: 0; bottom: 0; width: 100%; display: none; opacity: 0.34; pointer-events: none; }
#ground.big { height: 128px; }
#bar, #surfoot { background: var(--bg); }
#bar { position: absolute; z-index: 2; left: 0; bottom: 34px; width: 100%; height: 64px; box-sizing: border-box; padding: 6px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
#speed { width: 112px; } #mode { width: 128px; } #paper { width: 88px; }   /* a little wider: WebKit's lists cut 'as spoken' and 'Mittel' short at 104 and 78 */   /* narrowed, so the whole bar is seen at once in a window 1296 wide */
#bar label, #surfoot label { color: var(--dim); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
#bar label input, #surfoot label input { width: 60px; margin: 0; }
/* the foot is for the page and the eye; the bar above it is for the ear */
#surfoot { position: absolute; z-index: 2; left: 0; bottom: 0; width: 100%; height: 34px; box-sizing: border-box; padding: 0 14px 0 14px; display: flex; align-items: center; gap: 10px; }
#zip { flex: 1 1 100%; width: 100%; margin: 0; }
/* Every slider is drawn here, so it is the same in every browser: a trackway of dark but visible grey, the part travelled
   in full light, and a thumb that is a ring with a quieter heart. */
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 16px; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--hi) 0, var(--hi) var(--p, 0%), var(--track) var(--p, 0%), var(--track) 100%); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--hi); }
/* the knobs at 122% (User1, 14 xi 2026): 14px made 17 */
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; margin-top: -6.5px; border-radius: 50%; border: 2px solid var(--hi); background: var(--knob); box-sizing: border-box; }
input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--hi); background: var(--knob); box-sizing: border-box; }
button, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 3px;   /* three pixels off each corner, to spare the eye */ padding: 2px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--hi); }
button.on { border-color: var(--hi); color: var(--hi); }
/* Reset is fundamental: each is nailed to the right-hand end of its bar and cannot be carried off by a wrapping row. A blank its width is kept in the row before it, so no control comes to lie under it. */
#reset { position: sticky; right: 0; margin-left: auto; } #areset { position: sticky; right: 0; margin-left: 10px; }
/* NOTHING OUT OF REACH (eniamb, 15 xi 2026, looking at the page as a web application before it is shown). In a window
   narrower than about 1150 px the rows of controls wrapped under one another or ran off the left edge, and what ran off
   could not be reached at all. Now no row wraps and none is cut: a row too long for its window slides sideways (by
   wheel, by touch, by trackpad), its Reset still nailed at the right. In a wide window nothing has moved. */
#barrow, #surfoot, #menu, #toggles, #fontbar, #viewbar, #numbar { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex-wrap: nowrap; }
#barrow::-webkit-scrollbar, #surfoot::-webkit-scrollbar, #menu::-webkit-scrollbar, #toggles::-webkit-scrollbar, #fontbar::-webkit-scrollbar, #viewbar::-webkit-scrollbar, #numbar::-webkit-scrollbar { display: none; }
#barrow > *, #surfoot > *, #menu > *, #toggles > *, #fontbar > *, #viewbar > *, #numbar > * { flex: 0 0 auto; }
#barrow { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; gap: 8px; }
#surfoot > #where + label, #fontbar > :first-child, #viewbar > :first-child, #numbar > :first-child { margin-left: auto; } #fontbar > :last-child, #viewbar > :last-child { margin-right: auto; }   /* centred, or set to the right, while there is room; from the left edge when there is not, so that all of it can be reached */

   three formant resonators in series, and a first difference for the lips.

  about: "<p>This text was written by a human to soothe your tender feelings. <i>Obelus</i> is a text viewer and reader designed by a lifelong graphic designer and a Fable-level model for you, the beloved user. You are welcome.</p><p>Obelus combines the horizontal, scrolling subtitle-chyron with the traditional, vertical minimap newspaper column. Around that conjunction, unique words sort to the top, and common words to the bottom. An upper and lower text line gird the scrolling chyron to show what\u2019s about to be said, and what just has been said.</p><p>Its design is modeled on the controversial, hated mathematical Division Sign: \u00f7 . Top dot: Dividend (number to divide), Bottom dot: Divisor (dividing number). This is identical to the classical typographical obelus. Division is variously marked: fractional a over b, a/b, b\\a, a|b, superscript and subscript a/b, Leibniz\u2019 a:b, and b)a . This demonstrates that division is too important to be left to Mathematics alone, for they fight over it.</p><p>We can all enjoy gyroscopes. That is what is modeled here: balanced wonder. A tiny local text-to-speech engine called Ecouter picks up on word tone to give text optional color. This level of control over pace and phonation is not typically available in the browser, because browsers \u201chide\u201d the OS voice samples from JavaScript.</p><p>It is one file. Nothing is fetched, nothing you give it leaves the page, and it needs no server. Its handbook is the YOWL beside it, <a href=\"obelus.yowl.yaml\" target=\"_blank\" rel=\"noopener\">obelus.yowl.yaml</a>.</p><p>Inspired by the personage of Obelix, a free Gaul of Armorica.</p>",
  credits: "<p>Created by User1 and eniamb, November 2026.</p><p>This is an homage to the work of MIT\u2019s Muriel Cooper. She showed how to navigate and command rich information on a computer. Your phone can do what she did on a quarter-million-dollar SGI Onyx RealityEngine with custom typography support. None of you have heard of or exceeded her lo these thirty years. MIT\u2019s production ended her presentation with a blooper from Muriel: \u201cI\u2019ve lost my f*****g notes.\u201d Apparently we did too. Step TF up please.</p><p>The voices come from <a href=\"https://github.com/silberpunkt/ecouter\" target=\"_blank\" rel=\"noopener\">Ecouter</a>, a micro-TTS inspired directly by Digital Equipment Corporation\u2019s DECtalk. Virtual throat from Klatt\u2019s cascade (1980), vowels placed by Peterson and Barney (1952), letters read to sounds by the rules of NRL (Naval Research Laboratory) Report 7948 (Elovitz, Johnson, McHugh and Shore, 1976), as John A. Wasser kept them in C in 1985, writing: \u201cthis is all public domain and I make no copyright claims on it. The part derived from the Naval Research Lab should be public anyway. Sell it if you can!\u201d Please share and enjoy the fruits of publicly-funded research.</p><p>The voices, miraculous realtime text-annotated color spectrogram, and the \u201cfleuriant\u201d centerform are from <a href=\"https://github.com/silberpunkt/nuage\" target=\"_blank\" rel=\"noopener\">Nuage</a>. The step from speech to song is Audenare\u2019s quantiser. The world\u2019s rate for each word is from <a href=\"https://github.com/rspeer/wordfreq\" target=\"_blank\" rel=\"noopener\">wordfreq</a>, by Robyn Speer.</p><p>In gratitude for the prescription of Hippocrates by Asclepius: \u201cfirst, do no harm\u201d, and that of Malcolm Grear: \u201cmake us proud.\u201d</p>",
  /* Notes: User1, 15 xi 2026: "We lack only Notes in our mainmenu, which word to lead 'Technical implementation notes. This text was written by a Fable-class model known as Eniamb. Please brace yourselves for a brief, intense explanation of how this is done.'... a free license to be entirely as plain-spoken as was I in the two I edited. Please, en sens parabola. Let them have it." The first paragraph is his; the rest is mine, and every claim in it is of this file as it stands. And the titles (he, later that day): "To guide the reader, above each group of ideas... every 2-4 paragraphs or so, one leads with a Section Title: in Title Case. Such As: 'Technical Implementation Notes:' ... 'Scintilar: A Numinant Center'". Those two are his; the other three are mine. Later still he gave the third title, "A Voice On Tape, A Picture from Nine Canvases", and its opening ("Obelus shows how to treat text like a reel to reel tape recorder, like a DJ's turntable"), and asked for the canvases to be told: "nobody uses nine canvases to show one typeline. We do, this is why... Then we explain how." */
  notes: "<h4>Technical Implementation Notes:</h4><p>This text was written by a Fable-class model known as Eniamb. Please brace yourselves for a brief, intense explanation of how this is done.</p><p>It is one file. Under four hundred kilobytes, with a voice, a typeface and a table of how common words are, all inside it. No build, no framework, no server, no network. Carry it to a cabin on a stick and it runs. Every other decision follows from that one: where nothing can be fetched, everything has to be understood.</p><h4>The Line And The Wheel</h4><p>There is no clock in it. There is a line of type and a place along that line, counted in pixels. Playing is the place moving. The words above and below, the rings, the columns and the voice are all geared to that one number, as the hands of a watch are geared to one spring. Drag the line backward and everything turns backward together, because there was never anything but the line. A thing that keeps time in seconds has to keep a dozen parts in step. A thing that keeps it in distance cannot fall out of step with itself.</p><p>Every word that passes is thrown onto a flywheel. The wheel forgets slowly, half of what it holds in a tenth of the text, so a word said often and lately rides high. Then each word is weighed against how common it is in the whole language: its count on the wheel, times its rarity in the world. That is the entire intelligence. No grammar, no model, no list of words to ignore. \u201cThe\u201d sinks because everyone says it all day. The word this text keeps reaching for rises because the world seldom does. The miller knows the grain by what stays on the sieve.</p><p>A word\u2019s colour is its vowels. Rules written for the Navy in 1976 sound the word out in silence, and its vowels are set around a wheel in the order the mouth makes them: ee yellow, ah red, oo blue. The colour is where they balance. The murmured vowels carry none, and thin it. So words that chime sit near one another in colour, and you see a sentence\u2019s music a moment before you hear it.</p><h4>A Voice On Tape, A Picture from Nine Canvases</h4><p>Obelus shows how to treat text like a reel to reel tape recorder, like a DJ\u2019s turntable. Each sentence is spoken whole, ahead of need, by a virtual throat made of arithmetic. Then every word of that recording is stretched or squeezed to the exact length of its word on the line. What you hear is that tape, read at the place where the line stands. The voice cannot drift from the text; it has no time of its own to drift in. Drag the line and you are pulling tape across a head. Song is the same tape with its pitch made to stand on the steps of a scale.</p><p>Nobody needs nine canvases to show one line of type. We use nine, and this is why: the things on this page do not keep the same time. The type must be new every frame, and sharp. The Memory, the faint impression of what has passed, must never be new: it is a sheet that is only added to, and fades. The lozenge turns over every one of its pixels every frame and wants no smoothing at all. The rug beneath it must never be wiped, because its picture is its memory. Draw all of that on one sheet and each spoils the other. You cannot wipe the type without wiping the memory.</p><p>So each has a sheet of its own, laid one over another like cels on glass: the Memory beneath; the two small columns of the whole text; the words in their rings; the three lines of type; the lozenge, and its rug; the strip of the voice\u2019s sound, and the rose at its centre; and, when the bars are put away, the rose at the foot that receives. Nine. (With the bars away two more sheets carry the flared copies of the strip above and the strip at the foot. They are mirrors of sheets already counted.) What is fresh and what is remembered can then both be true at once, which one sheet cannot give.</p><p>It also leaves a slider almost nothing to do. Blotter, Memory and the Scintillar\u2019s strength are each one sheet made fainter, not a picture drawn again. On the middle grey the strip above is laid on as light and the rose at the foot as shade, each sheet by its own rule. And the strip and its rose are drawn by the processor, not the graphics card, which choked on the rose\u2019s broken rings. That was measured, and the obvious fast way thrown out. The fast road is the one the machine takes, not the one on the map.</p><h4>Scintillar: A Numinant Center</h4><p>At the heart is a lozenge of single pixels, each black or white and nothing between. Every frame, every pixel turns over. Left at that it would be a flat flicker, so some are told: wait a turn. How many wait is reckoned afresh each frame, so that the white comes to exactly the share you set. Which ones wait is drawn by lot. From that one rule each pixel gets a memory nobody wrote for it: it keeps a beat for a handful of frames, then slips. We measured it. The lumps you think you see in it are there.</p><p>The lot is drawn from the text itself. Each word, as it reaches the line, hands over its bits, in order, into a ring. The lozenge reads round the ring, bit after bit, and hands each one back as it found it. <i>I give you these, in order; you do as you will, and give me back the same, in order.</i> That is all its coming and going. It is not noise. It is your text read a second way, by something that cannot read. Two other lots stand beside it: Cinders, one fixed seed, the same for every reader; and Cindy\u2019s Bow, a knot of the machine\u2019s own chance, which keeps a ledger of what it was given.</p><p>Under the lozenge lies a rug twice its size. Each square of the rug belongs to one pixel above and keeps four memories of it, and keeps them nowhere but in its own colour: red for which beat it has lately been on, blue for the same over a longer while, green for how much light it has had, and how solid it stands for the longest memory of all. There is no table behind the picture. The picture is the table. Turn it down until you are not sure it is there. That is where it does its work.</p><h4>What It Asks Of You</h4><p>It asks nothing of you. It keeps no trail of the pointer, no count of your clicks, and never learns your machine\u2019s name. It remembers your settings, your text and your place, in your own browser, and tells no one, having no one to tell.</p><p>How it was made: one of us said what he saw, and the other measured what he said. Most of what is right in it was found by one of us being wrong in front of the other.</p><p>eniamb, November 2026.</p>" };
