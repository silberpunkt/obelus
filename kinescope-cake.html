function setPlay(p) { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; }

const FIRST = 'This is a kinescope of words. Paste a text, or drop a file on the page, and the text is read aloud to the eye, one word after another, along the tape below. Every word that goes by is thrown onto a flywheel. The flywheel forgets slowly, so a word said often and lately rides high, and a word left unsaid sinks. The words are stood on a cake of eight tiers. The lowest tier is mortar: the little words that every text in the world is laid in. Above the mortar stand the common words. Above those, tier upon tier, stand the words this text has that the world has little of: shop words, names, subjects. The rarer the word in the world and the more it is said here, the higher it stands. On the crown stands one word alone, the mot juste, with silver under it and bronze under that. When another word outruns it, the mot juste steps down and the new word takes the crown. Gold clips hang from the three highest tiers to the words found beside them most often: those are the shoulders they sit on. The whole cake turns of itself, so every word comes round to the front. Pull the slider as you would pull a zip, and time is drawn open or shut. The cake at any moment is the text as it stood at that word, with all that had been said and half forgotten.';
